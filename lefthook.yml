# Git hooks live at the repository root, so this config does too; each command
# declares the directory it actually runs in.

# Sequential, unlike pre-push: the bump and biome's stage_fixed both run
# `git add`, and concurrent ones contend for .git/index.lock. The whole group
# takes well under a second, so there is nothing to win by racing them.
pre-commit:
  parallel: false
  commands:
    # Every commit gets its own version, so the number in the status bar moves.
    # The script stages what it changed, so those files land in this commit.
    # Skip a bump with SKIP=bump-build — worth doing on `--amend`, which re-runs
    # pre-commit and would otherwise bump a second time for one commit.
    bump-build:
      priority: 1
      run: bun scripts/bump-build.ts
    # Milliseconds, and it catches a class of failure that only shows up on a
    # clean checkout: a source file the build imports but git ignores.
    sources-tracked:
      run: ./scripts/check-sources-tracked.sh
    frontend-check:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    frontend-types:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: bun run typecheck
    backend-check:
      root: "backend/"
      glob: "backend/**/*.{ts,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    backend-types:
      root: "backend/"
      glob: "backend/**/*.ts"
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    frontend-build:
      root: "frontend/"
      run: bun run build
    backend-types:
      root: "backend/"
      run: bun run typecheck
    # Seconds, not milliseconds — the event-bus tests stand up a fake Redis — so
    # these run on push rather than on every commit.
    backend-tests:
      root: "backend/"
      run: bun test tests/
    frontend-tests:
      root: "frontend/"
      run: bun test tests/
