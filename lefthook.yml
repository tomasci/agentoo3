# Git hooks live at the repository root, so this config does too; each command
# declares the directory it actually runs in.

# Sequential, unlike pre-push: the bump and biome's stage_fixed both run
# `git add`, and concurrent ones contend for .git/index.lock. The whole group
# takes well under a second, so there is nothing to win by racing them.
pre-commit:
  parallel: false
  commands:
    # Every commit gets its own version, so the number in the status bar moves.
    # The script stages what it changed, so those files land in this commit.
    # Skip a bump with SKIP=bump-build — worth doing on `--amend`, which re-runs
    # pre-commit and would otherwise bump a second time for one commit.
    bump-build:
      priority: 1
      run: bun scripts/bump-build.ts
    # Only when the checkout has none at all, which costs a directory test on a
    # normal commit. Without it, frontend-types below cannot typecheck in a
    # session's fresh worktree. pre-push is what keeps it honest, regenerating
    # unconditionally rather than trusting whatever this left behind.
    api-client:
      priority: 2
      run: ./scripts/gen-api-client.sh --if-missing
    # Milliseconds, and it catches a class of failure that only shows up on a
    # clean checkout: a source file the build imports but git ignores.
    sources-tracked:
      run: ./scripts/check-sources-tracked.sh
    frontend-check:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    frontend-types:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: bun run typecheck
    # The design tokens are only a system if nothing can bypass them, and a
    # raw hex or a stray 13px is invisible in review once a file is 200 lines
    # long. This is the gate that makes the two-tier boundary real: module
    # stylesheets may reference semantic tokens but never the primitives
    # underneath them. The token files themselves are exempt by construction —
    # the strict rules are scoped to *.module.scss in .stylelintrc.json.
    frontend-styles:
      root: "frontend/"
      glob: "frontend/**/*.scss"
      run: bunx stylelint {staged_files}
    backend-check:
      root: "backend/"
      glob: "backend/**/*.{ts,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    backend-types:
      root: "backend/"
      glob: "backend/**/*.ts"
      run: bun run typecheck

# `jobs` rather than `commands`, because this hook has an ordering constraint a
# flat parallel list cannot express: the client has to exist before anything
# typechecks, builds or imports it.
pre-push:
  jobs:
    # openapi.json and the generated client are git-ignored on purpose — see
    # backend/.gitignore — so any checkout that has not been through install.sh
    # has neither, and every frontend job below dies with a wall of "Cannot find
    # module @/shared/api/generated/...". That is not the rare case: each session
    # runs on its own fresh worktree, so it is the usual one.
    #
    # Regenerated unconditionally, not just when absent: this is the last gate
    # before code leaves the machine, and it is the point of not committing the
    # client that the checks run against routes as they are now.
    - name: api-client
      run: ./scripts/gen-api-client.sh

    - name: checks
      group:
        parallel: true
        jobs:
          - name: frontend-build
            root: "frontend/"
            run: bun run build
          - name: backend-types
            root: "backend/"
            run: bun run typecheck
          # Seconds, not milliseconds — the event-bus tests stand up a fake
          # Redis — so these run on push rather than on every commit.
          - name: backend-tests
            root: "backend/"
            run: bun test tests/
          - name: frontend-tests
            root: "frontend/"
            run: bun test tests/
