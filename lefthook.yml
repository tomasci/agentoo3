# Git hooks live at the repository root, so this config does too; each command
# declares the directory it actually runs in.

pre-commit:
  parallel: true
  commands:
    # Milliseconds, and it catches a class of failure that only shows up on a
    # clean checkout: a source file the build imports but git ignores.
    sources-tracked:
      run: ./scripts/check-sources-tracked.sh
    frontend-check:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    frontend-types:
      root: "frontend/"
      glob: "frontend/**/*.{ts,tsx}"
      run: bun run typecheck
    backend-check:
      root: "backend/"
      glob: "backend/**/*.{ts,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    backend-types:
      root: "backend/"
      glob: "backend/**/*.ts"
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    frontend-build:
      root: "frontend/"
      run: bun run build
    backend-types:
      root: "backend/"
      run: bun run typecheck
